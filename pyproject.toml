[project]
name = "bomreuse"
version = "0.1.0"
description = "Cross-variant sub-assembly reuse finder for a multi-variant Bill of Materials."
requires-python = ">=3.12"
# Standard library only so far. pydantic arrives with the two untrusted boundaries
# (LLM output, ground-truth schema) — DECISIONS.md 19.
dependencies = []

# [project.scripts] lands with src/bomreuse/cli.py: declaring an entry point that
# imports nothing yet would make `uv run bomreuse` fail for no reason.

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bomreuse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
