[project]
name = "bomreuse"
version = "0.1.0"
description = "Cross-variant sub-assembly reuse finder for a multi-variant Bill of Materials."
requires-python = ">=3.12"
# pydantic guards the two untrusted boundaries only (LLM output, ground-truth schema) —
# DECISIONS.md 19. Everything internal stays on the standard library.
dependencies = [
    "pydantic>=2.13,<3",
]

[project.scripts]
bomreuse = "bomreuse.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bomreuse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
