# ---------------------------------------------------------------------------------------
# Typo families — the reference-duplication defects the generator plants.
#
# `within_rules_reach = false` families are planted ON PURPOSE: the canonical-key rules of
# resolve.py (#4) cannot catch them, evaluate.py measures the shortfall, and the README's
# "Known limits" carries a figure instead of a caveat. A dataset that only plants defects
# the tool catches proves nothing (docs/ARCHITECTURE.md A2).
# ---------------------------------------------------------------------------------------

[[typo_families]]
id = "case_and_whitespace"
kind = "case_and_whitespace"
canonical = "BGI-2031"
variants = ["bgi-2031", "BGI-2031 ", " Bgi-2031"]
within_rules_reach = true
note = "Uppercasing and whitespace collapsing catch this family."

[[typo_families]]
id = "separator_dropped"
kind = "separator"
canonical = "BGI-2031"
variants = ["BGI2031", "BGI 2031", "BGI_2031"]
within_rules_reach = true
note = "Non-alphanumerics are dropped from the canonical key."

[[typo_families]]
id = "homoglyph_o_zero"
kind = "homoglyph"
canonical = "BGI-2031"
variants = ["BGI-2O31", "BGI-2O3I"]
within_rules_reach = true
note = "O folds to 0 and I folds to 1."

[[typo_families]]
id = "homoglyph_l_one"
kind = "homoglyph"
canonical = "HVAC-GRILLE-12"
variants = ["HVAC-GRILLE-l2", "HVAC-GRlLLE-12"]
within_rules_reach = true
note = "Lowercase l folds to 1."

[[typo_families]]
id = "transposition"
kind = "transposition"
canonical = "BGI-2031"
variants = ["BGI-2013"]
within_rules_reach = false
note = "Out of reach by construction: rules-only resolution cannot undo a transposition without string-distance matching, which would manufacture false merges."

[[typo_families]]
id = "missing_character"
kind = "missing_character"
canonical = "SEAT-FIX-KIT-4471"
variants = ["SEAT-FIX-KIT-447"]
within_rules_reach = false
note = "Out of reach by construction: a dropped character is indistinguishable from a different reference under rules only."

# ---------------------------------------------------------------------------------------
# Must-not-merge pairs — genuinely different products whose references are separated by
# exactly one character the folding rules collapse. The ground truth declares them as two
# distinct true components. If resolve.py merges them, resolution precision drops below 1
# and the miss is shown on purpose; if the rules hold, the 1.0 is a result rather than an
# artefact of the dataset (docs/ARCHITECTURE.md A2).
# ---------------------------------------------------------------------------------------

[[must_not_merge]]
id = "seat_rail_inox_vs_mark1"
left_reference = "SEAT-RAIL-I"
right_reference = "SEAT-RAIL-1"
left_true_component = "TRUE-0101"
right_true_component = "TRUE-0102"
collapsing_rule = "homoglyph_i_one"
reason = "Stainless-steel rail (I) against the mark-1 aluminium rail (1): different material, different price, not interchangeable."

[[must_not_merge]]
id = "door_seal_outer_vs_rev0"
left_reference = "DOOR-SEAL-O"
right_reference = "DOOR-SEAL-0"
left_true_component = "TRUE-0103"
right_true_component = "TRUE-0104"
collapsing_rule = "homoglyph_o_zero"
reason = "Outer seal (O) against revision 0 of the inner seal: different geometry."

[[must_not_merge]]
id = "hvac_grille_left_vs_type11"
left_reference = "HVAC-GRILLE-1L"
right_reference = "HVAC-GRILLE-11"
left_true_component = "TRUE-0105"
right_true_component = "TRUE-0106"
collapsing_rule = "homoglyph_l_one"
reason = "Left-hand grille (1L) against the type-11 grille: mirrored part, different drilling."
