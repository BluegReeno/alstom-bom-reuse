# dataset_spec.toml — the contract the synthetic dataset is generated from.
#
# Written in full BEFORE any data exists, and read through src/bomreuse/spec.py only.
# generate.py (#2) honours it, signatures.py applies its thresholds, evaluate.py reports
# against it and never moves it.
#
# DECISIONS.md 17 governs this file: the thresholds are never tuned against a score. If the
# reuse rule and a story case below disagree, the PART COUNTS change here — never the
# thresholds — and the commit message says which case forced the change.

version = "1"

[thresholds]
# Both counters of the signature distance are judged against the same budget, so the rule
# stays symmetric: three quantity differences are no more acceptable than three missing
# parts.  budget = min(max_abs_diff, ceil(diff_ratio * min(len(a), len(b))))
max_abs_diff = 3
diff_ratio = 0.25

[dataset]
# Below four components the relative budget degenerates: with min(len) == 1,
# ceil(0.25 * 1) == 1, so a one-component sub-assembly and a two-component one would come out
# "reusable".  The fix belongs to the data, not to the rule (docs/ARCHITECTURE.md A1).
min_subassembly_size = 4
# Unit assumed for a story-case component that declares none. Counts have no SI unit; "pcs"
# is the normalized spelling of the raw "pcs" / "units" / "u" the generator plants.
default_unit = "pcs"

